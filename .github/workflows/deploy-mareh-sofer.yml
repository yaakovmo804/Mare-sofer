name: Deploy Mareh Sofer Image Restoration

on:
  push:
    branches: [main]
    paths:
      - 'measure-stam/image-enhancer.html'
      - 'measure-stam/image-enhancer.css'
      - 'measure-stam/image-enhancer.js'
      - 'measure-stam/image-processing-core.js'
      - 'measure-stam/manifest-image-enhancer.webmanifest'
      - 'measure-stam/sw-image-enhancer.js'
      - '.github/workflows/deploy-mareh-sofer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare standalone site
        run: |
          mkdir -p _site
          cp measure-stam/image-enhancer.html _site/index.html
          cp measure-stam/image-enhancer.css _site/
          cp measure-stam/image-enhancer.js _site/
          cp measure-stam/image-processing-core.js _site/
          cp measure-stam/manifest-image-enhancer.webmanifest _site/
          cp measure-stam/sw-image-enhancer.js _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
