<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>לוח הקליגרפיה של מראה סופר</title>
<style>body{font:18px/1.6 system-ui,sans-serif;background:#f5f0e4;color:#193b34;max-width:540px;margin:10vh auto;padding:20px}a,button{font:inherit;color:#174d40;margin:7px 0}</style>
<h1>לוח הקליגרפיה</h1><p><a id="board" href="https://mareh-sofer-star.wqvdx95pnc.chatgpt.site/calligraphy">פתיחת הלוח המקורי של מראה סופר ★</a></p>
<section id="rescue" hidden><p>נמצאה במכשיר הדגמה מהלוח הקודם. אפשר לשמור אותה לפני המעבר.</p><button id="save">שמירת ההדגמה הקודמת כ־JSON</button></section>
<script src="./local.js"></script><script>
const board=document.getElementById('board');
KolmusLocal.read('drawing-draft').then(d=>{
  if(!d?.strokes?.length){location.replace(board.href);return;}
  document.getElementById('rescue').hidden=false;
  document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='הדגמת-כתיבה-קודמת.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);};
}).catch(()=>location.replace(board.href));
</script></html>
