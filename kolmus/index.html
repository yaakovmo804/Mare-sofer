<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#193833"><title>ציור בשתי אצבעות | מראה סופר</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./board.css"></head>
<body><header class="mast"><div class="name"><img width="44" height="44" src="./icon.svg" alt=""><div><span>מראה סופר</span><h1>ציור בשתי אצבעות</h1></div></div>
<div class="mast-actions"><a id="home" hidden href="/menu">מסך הבית</a><button type="button" id="open" class="quiet" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6h6l3 3h9l-3 10z"/></svg><span>פתיחת הדגמה</span></button><button type="button" id="record" class="record" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg><span>הקלטת הלוח</span></button></div></header>
<main class="studio">
<aside class="tools" aria-label="כלי ציור"><div class="panel-head"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17 15 4l5 5-12 11-4 1zM15 4l5 5M6 17l4-3"/></svg><h2>כלי כתיבה</h2></div>
<div class="group"><div class="label">אופן הכתיבה</div><div class="modes">
<button type="button" id="mode-fill" class="mode" data-mode="fill" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 13 4l7 4-8 12z"/></svg><span>מילוי קליגרפי</span></button><button type="button" id="mode-paths" class="mode" data-mode="paths" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c2-7 9 2 16-10M5 21c2-7 9 2 16-10"/></svg><span>מסלולי חודים</span></button><button type="button" id="mode-tip1" class="mode tip-mode" data-mode="tip1" aria-pressed="false"><span>חוד 1</span></button><button type="button" id="mode-tip4" class="mode tip-mode" data-mode="tip4" aria-pressed="false"><span>חוד 4</span></button></div></div>
<div class="group"><h3><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></svg>אות לרקע</h3><div class="fields"><label>אות<select id="glyph"></select></label><label>נוסח<select id="tradition"><option value="beitYosef">בית יוסף</option><option value="ari">האר״י</option></select></label></div>
<label class="range-head" for="opacity">שקיפות האות <output id="opacity-text"></output></label><input id="opacity" type="range" min="0" max="100" value="81" dir="ltr">
<div class="row"><button id="image-open" class="link-btn">בחירת תמונת רקע…</button><button id="no-ref" class="link-btn">ללא אות</button></div></div>
<div class="group"><label class="check"><input type="checkbox" id="mic"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3m-4 0h8"/></svg> הקלטה עם מיקרופון</label></div>
<details id="options"><summary><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8m4 0h6M3 17h3m4 0h11"/><circle cx="13" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg> הגדרות הלוח</summary><div class="detail-body">
<label>ספרות החיווי<select id="numbers"><option value="12">1 ו־2 לפי המגע</option><option value="14">1 ו־4 לפי החוד</option></select></label>
<label>המגע הראשון<select id="first-tip"><option value="1">חוד 1</option><option value="4">חוד 4</option></select></label>
<label>רקע הלוח<select id="grid"><option value="fine">קווי עזר</option><option value="original">הלוח המקורי</option><option value="plain">חלק</option></select></label>
<label>דיו למילוי<input id="ink" type="color" value="#222123"></label>
<div class="fields"><label>צבע חוד 1<input id="first" type="color" value="#227d7b"></label><label>צבע חוד 4<input id="fourth" type="color" value="#ab5133"></label></div>
<div class="fields"><label>עובי חוד 1<input id="w1" type="number" value="4" min="1" max="30"></label><label>עובי חוד 4<input id="w4" type="number" value="4" min="1" max="30"></label></div>
<div class="fields"><label>אטימות חוד 1<input id="a1" type="range" value="100" min="0" max="100"></label><label>אטימות חוד 4<input id="a4" type="range" value="100" min="0" max="100"></label></div>
<label>זווית בהדמיית עכבר <output id="mouse-angle-label">12°</output><input id="mouse-angle" type="range" min="-90" max="90" value="12" dir="ltr"></label></div></details>
<button type="button" id="new" class="new-btn" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg><span>לוח חדש</span></button></aside>
<section class="work"><div class="canvas-shell" id="shell"><div class="sheet-head"><div><span class="paper-dot"></span><strong id="source-name">לוח כתיבה</strong></div><div class="sheet-actions"><button type="button" id="undo" class="icon-btn" title="ביטול מקטע" aria-label="ביטול מקטע"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 3 11l5 5M4 11h10a6 6 0 0 1 6 6"/></svg></button><button type="button" id="redo" class="icon-btn" title="שחזור מקטע" aria-label="שחזור מקטע"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 5 5-5 5m4-5H10a6 6 0 0 0-6 6"/></svg></button><button type="button" id="fullscreen" class="icon-btn" title="הגדלת הלוח" aria-label="הגדלת הלוח"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></div>
<div class="paper"><canvas id="sheet" width="960" height="640" aria-label="משטח ציור בשתי אצבעות">משטח הציור זקוק לדפדפן התומך בקנבס.</canvas></div>
<div class="readings"><div><small>מנח החודים</small><strong id="clock" dir="ltr">—</strong></div><div><small>מעלות מ־<bdi>12:30</bdi></small><strong id="deg" dir="ltr">—</strong></div><div class="tip-key"><span><i class="one"></i><b id="tip1-key">1</b> חוד 1</span><span><i class="four"></i><b id="tip4-key">2</b> חוד 4</span></div></div></div>
<section class="timeline"><div class="timeline-title"><h2>מקטעי הכתיבה</h2><span id="count">0 מקטעים</span></div><div class="playrow"><button type="button" id="play" class="play" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m8 4 12 8-12 8z"/></svg><span>ניגון</span></button><input id="scrub" type="range" value="0" min="0" max="1" dir="ltr" aria-label="מיקום בזמן"><output dir="ltr" id="time">00:00</output><button id="live" type="button" class="quiet" hidden>חזרה לציור</button></div><div id="frames" class="frames"></div></section>
<div class="export-row"><button type="button" id="json" class="" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg><span>שמירת הדגמה</span></button><button type="button" id="png" class="" ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg><span>תמונת המקטע</span></button><button id="destinations">העברה ליישום…</button><a id="video-save" class="download-video" hidden>שמירת הסרטון</a></div>
<p id="status" role="status" aria-live="polite">הניחו שתי אצבעות על הלוח והזיזו אותן יחד.</p></section></main>
<dialog id="transfer"><h2>העברת ההדגמה</h2><label>מקור התמונה למדידה<select id="measure-layer"><option value="ink">הדיו שצויר</option><option value="reference">אות הרקע המקורית</option></select></label><div class="transfer-options"><button id="to-full">פתיחה במדידאות</button><button id="to-lite">מדיד אות לייט</button><button id="to-class">חדר השיעורים</button></div><p id="transfer-note"></p><button id="close-transfer" class="quiet">סגירה</button></dialog>
<dialog id="confirm"><h2 id="confirm-title">לוח חדש</h2><p id="confirm-text"></p><form method="dialog"><button value="cancel">ביטול</button><button value="ok" class="primary">המשך</button></form></dialog>
<input id="json-file" type="file" accept=".json,application/json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<script src="../measure-stam/letter-assets.js"></script><script src="./core.js"></script><script src="./local.js"></script><script src="./board.js"></script></body></html>
